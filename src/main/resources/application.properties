spring.application.name=recipe-management-service
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.root=INFO
logging.level.com.recipe=DEBUG

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Port
server.port=8081

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=A REST API for managing recipes with filtering capabilities
info.app.version=@project.version@
management.info.git.mode=full

# OAuth2 Resource Server (JWT)
# Configure one of these (prefer issuer-uri) to match your Identity Provider.
# For local Keycloak (common default): http://localhost:8080/realms/recipe
#
# Recommended: set via env var so the app can start even when IdP isn't running:
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080/realms/recipe
#
# spring.security.oauth2.resourceserver.jwt.issuer-uri=
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
